version: 2

builds:
  - binary: proof
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/tsarlewey/proof-cli/cmd.Version={{.Version}}

archives:
  - name_template: "proof_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

dockers_v2:
  - images: [ghcr.io/tsarlewey/proof-cli]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/tsarlewey/proof-cli
      org.opencontainers.image.description: MCP server for the Proof API (unofficial)
      org.opencontainers.image.licenses: MIT
    annotations:
      io.modelcontextprotocol.server.name: io.github.tsarlewey/proof-cli
