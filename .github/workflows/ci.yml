name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: make check

  # Builds binaries and container images exactly as a release would, without
  # publishing, so a broken Dockerfile or GoReleaser config fails here rather
  # than on a tag.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: MCP server answers initialize inside the image
        run: |
          IMAGE=$(docker images ghcr.io/tsarlewey/proof-cli --format '{{.Repository}}:{{.Tag}}' | grep amd64 | head -1)
          # Hold stdin open like a real client; the server exits 0 once it closes.
          { echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; sleep 3; } \
            | timeout 20 docker run -i --rm "$IMAGE" | tee out.json
          grep -q '"serverInfo"' out.json
      - name: server.json is valid
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate
